<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script><script src="theme.js"></script><script src="components.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<title>Оформление заказа</title>
</head>
<body data-nav class="bg-slate-50 text-slate-900 transition-colors dark:bg-slate-900 dark:text-slate-100">
<div id="app">
<main class="mx-auto max-w-xl px-4 py-8">
  <h1 class="h1 mb-6">Оформление заказа</h1>

  <!-- Степпер -->
  <ol class="mb-2 flex justify-between text-xs" aria-label="Шаги">
    <li v-for="(l, i) in labels" :key="l" class="flex flex-col items-center gap-1">
      <span :data-state="i < s ? 'done' : i === s ? 'active' : 'todo'" :aria-current="i === s ? 'step' : null" class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-300 font-bold text-slate-700 transition-colors data-[state=active]:bg-brand-600 data-[state=active]:text-white data-[state=done]:bg-success data-[state=done]:text-white"><i v-if="i < s" class="ic ic-check"></i><template v-else>{{ i + 1 }}</template></span>{{ l }}</li>
  </ol>
  <div role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="(s + 1) * 25" class="mb-6 h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700">
    <div class="h-full rounded-full bg-brand-600 transition-all duration-300" :style="{ width: (s + 1) * 25 + '%' }"></div></div>

  <form ref="f" novalidate class="card space-y-4" @input="check">
    <section data-step v-show="s === 0" class="space-y-4">
      <h2 class="h2">Личные данные</h2>
      <label class="block text-sm font-medium">Имя<input name="Имя" required minlength="2" class="input mt-1" autocomplete="name"></label>
      <label class="block text-sm font-medium">Email<input name="Email" type="email" required class="input mt-1" autocomplete="email"></label>
      <label class="block text-sm font-medium">Телефон<input name="Телефон" type="tel" required pattern="\+375[0-9]{9}" placeholder="+375291234567" class="input mt-1"></label>
    </section>
    <section data-step v-show="s === 1" class="space-y-4">
      <h2 class="h2">Адрес доставки</h2>
      <label class="block text-sm font-medium">Город<input name="Город" required class="input mt-1" value="Минск"></label>
      <label class="block text-sm font-medium">Улица и дом<input name="Адрес" required class="input mt-1"></label>
      <label class="block text-sm font-medium">Индекс<input name="Индекс" required pattern="[0-9]{6}" placeholder="220000" class="input mt-1"></label>
    </section>
    <section data-step v-show="s === 2" class="space-y-3">
      <h2 class="h2">Способ оплаты</h2>
      <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-300 p-3 transition-colors has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 dark:border-slate-600 dark:has-[:checked]:bg-slate-700"><input type="radio" name="Оплата" value="Банковская карта" required class="accent-brand-600">Банковская карта</label>
      <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-300 p-3 transition-colors has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 dark:border-slate-600 dark:has-[:checked]:bg-slate-700"><input type="radio" name="Оплата" value="ЕРИП" class="accent-brand-600">ЕРИП</label>
      <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-300 p-3 transition-colors has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 dark:border-slate-600 dark:has-[:checked]:bg-slate-700"><input type="radio" name="Оплата" value="Наличные при получении" class="accent-brand-600">Наличные при получении</label>
    </section>
    <section data-step v-show="s === 3" class="space-y-3">
      <h2 class="h2">Подтверждение</h2>
      <dl class="divide-y divide-slate-200 text-sm dark:divide-slate-700">
        <div v-for="p in sum" :key="p[0]" class="flex justify-between gap-4 py-1.5"><dt class="text-slate-500">{{ p[0] }}</dt><dd class="font-medium">{{ p[1] }}</dd></div></dl>
      <p class="font-semibold">Итого: 289 <span class="byn">Б</span></p>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" required class="h-4 w-4 accent-brand-600">Данные указаны верно</label>
    </section>
    <p v-if="err" role="alert" class="alert alert-error">Заполните выделенные поля.</p>
    <p v-if="done" role="status" class="alert alert-success">Заказ оформлен! Мы свяжемся с вами.</p>
    <div class="flex justify-between pt-2">
      <button type="button" @click="back" class="btn btn-secondary btn-md" :disabled="s === 0 || done">Назад</button>
      <button type="button" @click="next" class="btn btn-primary btn-md" :disabled="done">{{ s === 3 ? 'Оформить' : 'Далее' }}</button>
    </div>
  </form>
</main>
</div>
<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    const labels = ['Данные', 'Адрес', 'Оплата', 'Готово'];
    const s = ref(0), err = ref(false), done = ref(false), sum = ref([]), f = ref(null);
    function check(e) { e.target.setAttribute('aria-invalid', !e.target.checkValidity()); }
    function next() {
      const inputs = f.value.querySelectorAll('[data-step]')[s.value].querySelectorAll('input');
      let ok = true;
      inputs.forEach(i => { const v = i.checkValidity(); i.setAttribute('aria-invalid', !v); if (!v) ok = false; });
      err.value = !ok; if (!ok) return;
      if (s.value < 3) { s.value++; if (s.value === 3) sum.value = [...new FormData(f.value)].filter(([k, v]) => typeof v === 'string' && v); }
      else done.value = true;
    }
    function back() { s.value--; err.value = false; }
    return { labels, s, err, done, sum, f, check, next, back };
  }
}).mount('#app');
</script>
</body></html>
